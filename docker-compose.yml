# Guardian Gateway - Backend Docker Compose
# Includes: Backend API, PostgreSQL Database
# Frontend runs locally via: cd ../v0-guardian-gateway-ide && pnpm run dev
# Run with: docker-compose up --build

version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: guardian-db
    environment:
      POSTGRES_DB: guardian_gateway
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: ${DB_PASSWORD:-guardian_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U guardian" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: guardian-gateway-api:latest
    container_name: guardian-api
    ports:
      - "127.0.0.1:8000:8000"  # Bind to localhost only - prevents internet scanners
    environment:
      # Database connection
      # Use SQLite for persistence (or PostgreSQL: postgresql://guardian:${DB_PASSWORD:-guardian_dev_password}@db:5432/guardian_gateway)
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./guardian_gateway.db}

      # API Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_API_KEYS: ${ALLOWED_API_KEYS:-dev_key_1,dev_key_2}
      API_SECRET_KEY: ${API_SECRET_KEY:-dev_secret_key}

      # CORS - allow frontend
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000

      # URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}

      # Rate limiting
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}

      # GitHub App Configuration
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-./github-app-private-key.pem}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:3000/auth/github/callback}
      USE_MOCK_GITHUB: ${USE_MOCK_GITHUB:-false}
    volumes:
      - .:/app
      # Explicit SQLite database persistence - ensures database file persists across container restarts
      - ./guardian_gateway.db:/app/guardian_gateway.db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Frontend IDE Service - DISABLED (runs locally for faster HMR)
  # To run frontend: cd ../v0-guardian-gateway-ide && pnpm run dev
  # frontend:
  #   build:
  #     context: ../v0-guardian-gateway-ide
  #     dockerfile: Dockerfile
  #     args:
  #       NEXT_PUBLIC_API_URL: http://localhost:8000
  #   container_name: guardian-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #     NEXT_PUBLIC_GUARDIAN_API_KEY: ${GUARDIAN_API_KEY:-dev_key_1}
  #   volumes:
  #     - ../v0-guardian-gateway-ide:/app
  #     - /app/node_modules
  #     - /app/.next
  #   depends_on:
  #     - api
  #   restart: unless-stopped

volumes:
  postgres_data:
    driver: local
