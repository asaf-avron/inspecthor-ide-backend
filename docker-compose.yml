# Inspecthor - Backend Docker Compose
# Includes: Backend API, PostgreSQL Database, Dafny Verifier
# Frontend runs locally via: cd ../inspecthor-ide-frontend && pnpm run dev
# Run with: docker-compose up --build

version: '3.8'

services:
  # Dafny Verification Service (Isolated, Stateless)
  # SECURITY: No credentials, no database access, network isolated
  verifier:
    build:
      context: .
      dockerfile: verifier/Dockerfile
    image: inspecthor-verifier:latest
    container_name: inspecthor-verifier
    ports:
      - "127.0.0.1:8001:8001" # Internal only - not exposed to internet
    networks:
      - internal
    # SECURITY: No environment variables with credentials
    # SECURITY: No volumes mounting secrets or host filesystem
    # SECURITY: Read-only root filesystem
    read_only: true
    tmpfs:
      - /tmp:size=100M # Temp files for Dafny verification
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8001/health" ]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: inspecthor-db
    environment:
      POSTGRES_DB: inspecthor
      POSTGRES_USER: inspecthor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inspecthor_dev_password}
    volumes:
      - inspecthor_postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U inspecthor" ]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Backend API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: inspecthor-api:latest
    container_name: inspecthor-api
    ports:
      - "127.0.0.1:8000:8000" # Bind to localhost only - prevents internet scanners
    environment:
      # Database connection
      # Use SQLite for persistence (or PostgreSQL: postgresql://inspecthor:${DB_PASSWORD:-inspecthor_dev_password}@db:5432/inspecthor)
      DATABASE_URL: ${DATABASE_URL:-sqlite:///./inspecthor.db}

      # Persist data across restarts (set to true to reset on restart)
      DROP_EXISTING_TABLES: ${DROP_EXISTING_TABLES:-false}

      # API Configuration
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      ALLOWED_API_KEYS: ${ALLOWED_API_KEYS:-dev_key_1,dev_key_2}
      API_SECRET_KEY: ${API_SECRET_KEY:-dev_secret_key}

      # CORS - allow frontend
      CORS_ORIGINS: http://localhost:3000,http://frontend:3000

      # URLs
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}

      # Rate limiting
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-60}

      # GitHub App Configuration
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_PRIVATE_KEY_PATH: ${GITHUB_APP_PRIVATE_KEY_PATH:-./github-app-private-key.pem}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_OAUTH_REDIRECT_URI: ${GITHUB_OAUTH_REDIRECT_URI:-http://localhost:3000/auth/github/callback}
      USE_MOCK_GITHUB: ${USE_MOCK_GITHUB:-false}

      # Verifier Service URL (internal Docker network)
      VERIFIER_URL: ${VERIFIER_URL:-http://verifier:8001}
    networks:
      - internal
      - default
    volumes:
      - .:/app
      # Explicit SQLite database persistence - ensures database file persists across container restarts
      # - ./inspecthor.db:/app/inspecthor.db
    depends_on:
      db:
        condition: service_healthy
      verifier:
        condition: service_healthy
    restart: unless-stopped
  # Frontend IDE Service - DISABLED (runs locally for faster HMR)
  # To run frontend: cd ../inspecthor-ide-frontend && pnpm run dev
  # frontend:
  #   build:
  #     context: ../inspecthor-ide-frontend
  #     dockerfile: Dockerfile
  #     args:
  #       NEXT_PUBLIC_API_URL: http://localhost:8000
  #   container_name: inspecthor-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://localhost:8000
  #     NEXT_PUBLIC_INSPECTHOR_API_KEY: ${INSPECTHOR_API_KEY:-dev_key_1}
  #   volumes:
  #     - ../inspecthor-ide-frontend:/app
  #     - /app/node_modules
  #     - /app/.next
  #   depends_on:
  #     - api
  #   restart: unless-stopped

networks:
  internal:
    # Internal network for service-to-service communication
    # Verifier is isolated to this network only
    driver: bridge
    internal: true # No external access
  default:
    # Default network with external access
    driver: bridge

volumes:
  inspecthor_postgres:
    driver: local
