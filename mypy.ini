[mypy]
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = False
check_untyped_defs = True
ignore_missing_imports = True
namespace_packages = True
# plugins = sqlalchemy.ext.mypy.plugin  # Disabled: conflicts with types-sqlalchemy package

# Exclude non-production code and problematic packages
exclude = ^api/alembic/|^scripts/|^tests/|.*/mcp/

[mypy-mcp.*]
ignore_errors = True
follow_imports = skip

[mypy-api.database.*]
# SQLAlchemy models - plugin handles most typing
ignore_errors = False

[mypy-api.services.*]
# SQLAlchemy Column attribute access - plugin should handle but add ignores for safety
warn_return_any = False
