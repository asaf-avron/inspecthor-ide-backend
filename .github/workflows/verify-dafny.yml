name: Verify Dafny Specifications
# Cache test: Second build to verify cache is working

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'api/verification/**/*.dfy'
      - '.github/workflows/verify-dafny.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'api/verification/**/*.dfy'
      - '.github/workflows/verify-dafny.yml'
  workflow_dispatch:

jobs:
  verify-dafny:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Debug cache info
        run: |
          echo "Current branch: ${{ github.ref }}"
          echo "Build context files changed:"
          git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "First commit or no previous commit"
      
      - name: Build and Cache API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.api
          load: true
          push: false
          tags: guardian-gateway-api:latest
          cache-from: |
            type=gha,scope=global
            type=gha,scope=refs/heads/main
            type=gha,scope=${{ github.ref }}
          cache-to: type=gha,mode=max,scope=global
      
      - name: Verify Dafny specifications
        run: |
          # Verify all Dafny files in api/verification/
          docker run --rm -v "${{ github.workspace }}:/app" -w /app guardian-gateway-api:latest bash -c "dafny verify --solver-path=/root/.dotnet/tools/z3/bin/z3-4.12.1 --allow-warnings api/verification/*.dfy"
      
      - name: Check verification results
        if: failure()
        run: |
          echo "Dafny verification failed. Please check the output above."
          exit 1
